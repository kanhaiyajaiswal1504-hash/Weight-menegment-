
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Booking - Weight Management</title>
<style>
body{
font-family:Arial,sans-serif;
background:#f1f7f5;
padding:20px;
}
.container{
max-width:450px;
margin:auto;
background:white;
padding:22px;
border-radius:15px;
box-shadow:0 3px 15px #ccc;
}
h2{text-align:center;color:#087c59;}
input,select,button{
width:100%;
padding:13px;
margin:9px 0;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
font-size:16px;
}
button{
background:#159b53;
color:white;
border:0;
font-weight:bold;
cursor:pointer;
}
</style>
</head>
<body>
<div class="container">
<h2>Online Booking</h2>
<form id="bookingForm">
<input id="name" placeholder="Patient Name" required>
<input id="age" type="number" placeholder="Age" required>
<select id="gender" required>
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>
<input id="mobile" type="tel" placeholder="Mobile Number" required>
<input id="weight" type="number" step="0.1" placeholder="Current Weight (KG)" required>
<input id="height" type="number" step="0.1" placeholder="Height (CM)" required>
<input id="goal" type="number" step="0.1" placeholder="Target Weight (KG)">
<select id="package" required>
<option value="">Select Package</option>
<option>Weight Loss</option>
<option>Weight Gain</option>
<option>Diet Consultation</option>
<option>Full Weight Management</option>
</select>
<input id="date" type="date" required>
<button type="submit">Book Now on WhatsApp</button>
</form>
</div>

<script>
document.getElementById("bookingForm").addEventListener("submit",function(e){
e.preventDefault();

const msg =
"NEW WEIGHT MANAGEMENT BOOKING%0A"+
"Name: "+encodeURIComponent(document.getElementById("name").value)+"%0A"+
"Age: "+encodeURIComponent(document.getElementById("age").value)+"%0A"+
"Gender: "+encodeURIComponent(document.getElementById("gender").value)+"%0A"+
"Mobile: "+encodeURIComponent(document.getElementById("mobile").value)+"%0A"+
"Current Weight: "+encodeURIComponent(document.getElementById("weight").value)+" KG%0A"+
"Height: "+encodeURIComponent(document.getElementById("height").value)+" CM%0A"+
"Target Weight: "+encodeURIComponent(document.getElementById("goal").value)+" KG%0A"+
"Package: "+encodeURIComponent(document.getElementById("package").value)+"%0A"+
"Date: "+encodeURIComponent(document.getElementById("date").value);

window.open("https://wa.me/918120262770?text="+msg,"_blank");
});
</script>
</body>
</html>
