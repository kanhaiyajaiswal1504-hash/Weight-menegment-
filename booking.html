<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Online Booking - Krishna Health Care</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 padding:15px;
 background:#f2f6fa;
 font-family:Arial,sans-serif;
 color:#18304e;
}

.container{
 max-width:600px;
 margin:20px auto;
 background:white;
 padding:22px;
 border-radius:15px;
 box-shadow:0 5px 20px #0001;
}

h2{color:#102b50}

.summary{
 background:#fff4e5;
 padding:15px;
 border-radius:10px;
 margin:15px 0;
}

.price{
 font-size:26px;
 color:#bd2338;
 font-weight:bold;
}

.old{
 text-decoration:line-through;
 color:#888;
 margin-left:8px;
}

label{
 display:block;
 margin-top:13px;
 font-weight:bold;
}

input,select,textarea{
 width:100%;
 padding:12px;
 border:1px solid #ccc;
 border-radius:8px;
 font-size:16px;
}

button{
 width:100%;
 padding:15px;
 background:#168447;
 color:white;
 border:0;
 border-radius:9px;
 font-size:17px;
 font-weight:bold;
 margin-top:20px;
 cursor:pointer;
}

.back{
 display:block;
 margin-top:15px;
 color:#1769aa;
 text-decoration:none;
}

</style>
</head>

<body>

<div class="container">

<h2>Online Booking</h2>

<p>Krishna Health Care Services</p>

<div class="summary">

<strong id="packageName">
Select Aarogyam Package
</strong>

<p id="testCount"></p>

<div>
<span class="price" id="offerPrice">₹0</span>
<span class="old" id="mrpPrice"></span>
</div>

<strong>50% Discount Applied Automatically</strong>

</div>

<form id="bookingForm">

<label>Select Aarogyam Package *</label>

<select id="packageSelect" required>

<option value="">Select Package</option>

<option value="A Pro">Aarogyam A Pro - 12 Tests</option>

<option value="B Pro">Aarogyam B Pro - 59 Tests</option>

<option value="C Pro">Aarogyam C Pro - 71 Tests</option>

<option value="D Pro">Aarogyam D Pro - 78 Tests</option>

<option value="E Pro">Aarogyam E Pro - 85 Tests</option>

<option value="F Pro">Aarogyam F Pro - 111 Tests</option>

<option value="X Pro">Aarogyam X Pro - 124 Tests</option>

<option value="XL Pro">Aarogyam XL Pro - 133 Tests</option>

</select>

<label>Patient Name *</label>
<input type="text" id="name" required placeholder="Enter Patient Name">

<label>Age *</label>
<input type="number" id="age" required min="1" max="120">

<label>Gender *</label>
<select id="gender" required>
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>

<label>Mobile Number *</label>
<input type="tel" id="phone" maxlength="10"
pattern="[0-9]{10}" required placeholder="10 Digit Mobile">

<label>Address *</label>
<textarea id="address" required></textarea>

<label>Booking Date *</label>
<input type="date" id="date" required>

<label>Time Slot</label>
<select id="time">
<option>Any Time</option>
<option>6 AM - 8 AM</option>
<option>8 AM - 10 AM</option>
<option>10 AM - 12 PM</option>
<option>12 PM - 2 PM</option>
<option>2 PM - 4 PM</option>
<option>4 PM - 6 PM</option>
</select>

<label>Collection Type</label>
<select id="collection">
<option>Home Collection</option>
<option>Visit Collection Centre</option>
</select>

<button type="submit">
Submit Booking on WhatsApp
</button>

</form>

<a class="back" href="index.html">
← All Packages
</a>

</div>

<script>

const WHATSAPP_NUMBER="918120262770";

const packages={

"A Pro":{tests:12,mrp:999},
"B Pro":{tests:59,mrp:1999},
"C Pro":{tests:71,mrp:2999},
"D Pro":{tests:78,mrp:3999},
"E Pro":{tests:85,mrp:5499},
"F Pro":{tests:111,mrp:6999},
"X Pro":{tests:124,mrp:8499},
"XL Pro":{tests:133,mrp:9999}

};

function money(n){
return "₹"+Number(n).toLocaleString("en-IN",{
minimumFractionDigits:2,
maximumFractionDigits:2
});
}

const select=document.getElementById("packageSelect");

function updatePrice(){

let p=packages[select.value];

if(!p){
document.getElementById("packageName").innerText=
"Select Aarogyam Package";
document.getElementById("testCount").innerText="";
document.getElementById("offerPrice").innerText="₹0";
document.getElementById("mrpPrice").innerText="";
return;
}

document.getElementById("packageName").innerText=
"Aarogyam "+select.value;

document.getElementById("testCount").innerText=
p.tests+" Tests Package";

document.getElementById("mrpPrice").innerText=
money(p.mrp);

document.getElementById("offerPrice").innerText=
money(p.mrp*0.50);

}

select.addEventListener("change",updatePrice);


// Package selected from Packages page

const params=new URLSearchParams(window.location.search);

let selected=(params.get("package")||"")
.replace(/^Aarogyam\s+/i,"");

if(packages[selected]){
select.value=selected;
}

updatePrice();


// Minimum booking date

let today=new Date();
document.getElementById("date").min=
new Date(today.getTime()-today.getTimezoneOffset()*60000)
.toISOString().split("T")[0];


// WhatsApp Booking Submit

document.getElementById("bookingForm")
.addEventListener("submit",function(e){

e.preventDefault();

let p=packages[select.value];

if(!p){
alert("Please Select Aarogyam Package");
return;
}

let offer=p.mrp*0.50;

let message=
"NEW AAROGYAM BOOKING\n"+
"Krishna Health Care Services\n\n"+

"Patient Name: "+
document.getElementById("name").value+"\n"+

"Age: "+
document.getElementById("age").value+"\n"+

"Gender: "+
document.getElementById("gender").value+"\n"+

"Mobile: "+
document.getElementById("phone").value+"\n"+

"Address: "+
document.getElementById("address").value+"\n\n"+

"Package: Aarogyam "+select.value+"\n"+

"Total Tests: "+p.tests+"\n"+

"MRP: "+money(p.mrp)+"\n"+

"Discount: 50%\n"+

"Offer Price: "+money(offer)+"\n\n"+

"Booking Date: "+
document.getElementById("date").value+"\n"+

"Time: "+
document.getElementById("time").value+"\n"+

"Collection: "+
document.getElementById("collection").value;


// WhatsApp Open

let url=
"https://api.whatsapp.com/send?phone="+
WHATSAPP_NUMBER+
"&text="+encodeURIComponent(message);

// Open WhatsApp in new tab
let wa=window.open(url,"_blank");

// Fallback if popup blocked
if(!wa){
window.location.href=url;
}

});

</script>

</body>
</html>
