
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thyrocare Online Booking</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 padding:15px;
 font-family:Arial,sans-serif;
 background:#f2f5fa;
 color:#202b40;
}

.container{
 max-width:650px;
 margin:auto;
}

.header{
 background:#10284f;
 color:white;
 padding:25px;
 text-align:center;
 border-radius:15px;
}

.header h1{margin:0 0 10px}

form{
 background:white;
 padding:20px;
 margin-top:18px;
 border-radius:15px;
 box-shadow:0 3px 15px #ddd;
}

label{
 display:block;
 margin-top:15px;
 margin-bottom:7px;
 font-weight:bold;
}

input,select,textarea{
 width:100%;
 padding:13px;
 border:1px solid #ccd3df;
 border-radius:8px;
 font-size:16px;
}

textarea{height:80px}

button{
 width:100%;
 padding:16px;
 margin-top:22px;
 background:#159b63;
 color:white;
 border:0;
 border-radius:10px;
 font-size:17px;
 font-weight:bold;
}

.back{
 display:block;
 text-align:center;
 margin:20px;
 color:#10284f;
 text-decoration:none;
 font-weight:bold;
}

.note{
 font-size:12px;
 color:#666;
 line-height:1.5;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>THYROCARE JAANCH</h1>
<h2>ONLINE BOOKING</h2>
<p>Aapki Sehat, Hamari Zimmedari</p>
</div>

<form id="bookingForm">

<label>Patient Name *</label>
<input type="text" name="name"
placeholder="Enter Patient Name" required>

<label>Age *</label>
<input type="number" name="age"
min="1" max="120" placeholder="Enter Age" required>

<label>Gender *</label>
<select name="gender" required>
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>

<label>Mobile Number *</label>
<input type="tel" name="mobile"
pattern="[0-9]{10}" maxlength="10"
placeholder="10 Digit Mobile Number" required>

<label>Select Package *</label>
<select name="package" required>
<option value="">Select Package</option>
<option>Male Package - Rs.2899</option>
<option>Female Package - Rs.3499</option>
</select>

<label>Full Address *</label>
<textarea name="address"
placeholder="Enter Full Address" required></textarea>

<label>Pin Code *</label>
<input type="text" name="pincode"
pattern="[0-9]{6}" maxlength="6"
placeholder="Enter 6 Digit Pin Code" required>

<label>Booking Date *</label>
<input type="date" name="date" id="date" required>

<label>Time Slot *</label>
<select name="time" required>
<option value="">Select Time</option>
<option>6:00 AM - 7:00 AM</option>
<option>7:00 AM - 8:00 AM</option>
<option>8:00 AM - 9:00 AM</option>
<option>9:00 AM - 10:00 AM</option>
<option>10:00 AM - 11:00 AM</option>
<option>11:00 AM - 12:00 PM</option>
</select>

<label>Sample Collection *</label>
<select name="collection" required>
<option>Home Collection</option>
<option>Collection Centre</option>
</select>

<label>Additional Message</label>
<textarea name="message"
placeholder="Any other information"></textarea>

<button type="submit">
BOOK APPOINTMENT
</button>

<p class="note">
Booking request WhatsApp par bheja jayega.
Final booking confirmation hamari team degi.
</p>

</form>

<a class="back" href="index.html">
← Back to Home Page
</a>

</div>

<script>
const dateField = document.getElementById("date");

const today = new Date();
dateField.min = new Date(
 today.getTime() - today.getTimezoneOffset()*60000
).toISOString().split("T")[0];

document.getElementById("bookingForm")
.addEventListener("submit",function(e){

e.preventDefault();

if(!this.reportValidity()) return;

const f = new FormData(this);

const message =
"THYROCARE JAANCH - ONLINE BOOKING\n\n"+
"Patient Name: "+f.get("name")+"\n"+
"Age: "+f.get("age")+"\n"+
"Gender: "+f.get("gender")+"\n"+
"Mobile: "+f.get("mobile")+"\n"+
"Package: "+f.get("package")+"\n"+
"Address: "+f.get("address")+"\n"+
"Pin Code: "+f.get("pincode")+"\n"+
"Date: "+f.get("date")+"\n"+
"Time: "+f.get("time")+"\n"+
"Collection: "+f.get("collection")+"\n"+
"Message: "+f.get("message");

const url =
"https://wa.me/918120262770?text="+
encodeURIComponent(message);

window.location.href=url;

});
</script>

</body>
</html>
