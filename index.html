<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thyrocare Packages - Krishna Health Care</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f3f6fa;
 color:#18304e;
}
header{
 background:linear-gradient(120deg,#102b50,#1769aa);
 color:white;
 text-align:center;
 padding:25px 12px;
}
header h1{margin:0;font-size:25px}
header p{margin-bottom:0}
.hero{text-align:center;padding:25px 12px}
.hero h2{color:#102b50}
.offer{
 background:#fff0d0;
 color:#8a4d00;
 padding:10px 18px;
 border-radius:30px;
 display:inline-block;
 font-weight:bold;
}
.grid{
 max-width:1100px;
 margin:auto;
 padding:15px;
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
 gap:16px;
}
.card{
 background:white;
 border-radius:15px;
 padding:18px;
 box-shadow:0 5px 18px #0001;
}
.card h3{color:#102b50;margin-top:0}
.old{
 text-decoration:line-through;
 color:#888;
}
.price{
 font-size:25px;
 color:#c9273a;
 font-weight:bold;
}
.discount{
 color:green;
 font-weight:bold;
}
.buttons{
 display:flex;
 gap:8px;
 margin-top:15px;
}
.btn{
 flex:1;
 padding:12px 8px;
 text-align:center;
 text-decoration:none;
 border-radius:8px;
 font-weight:bold;
}
.call{background:#eaf3ff;color:#14558f}
.book{background:#c9273a;color:white}
footer{
 background:#102b50;
 color:white;
 text-align:center;
 padding:22px;
}
</style>
</head>

<body>

<header>
<h1>Krishna Health Care Services</h1>
<p>Thyrocare Aarogyam Health Checkup Packages</p>
</header>

<section class="hero">
<h2>अपनी सेहत की जाँच आज ही बुक करें</h2>
<p>सभी Aarogyam Packages पर 50% Discount</p>
<div class="offer">SPECIAL OFFER – 50% OFF</div>
</section>

<div class="grid" id="packages"></div>

<footer>
<h3>Aapki Sehat, Hamari Zimmedari</h3>
Krishna Health Care Services<br>
Call: 8120262770
</footer>

<script>

const packages=[
{code:"A Pro",tests:12,mrp:999},
{code:"B Pro",tests:59,mrp:1999},
{code:"C Pro",tests:71,mrp:2999},
{code:"D Pro",tests:78,mrp:3999},
{code:"E Pro",tests:85,mrp:5499},
{code:"F Pro",tests:111,mrp:6999},
{code:"X Pro",tests:124,mrp:8499},
{code:"XL Pro",tests:133,mrp:9999}
];

function money(n){
return "₹"+Number(n).toLocaleString("en-IN",{
minimumFractionDigits:2,
maximumFractionDigits:2
});
}

document.getElementById("packages").innerHTML=
packages.map(p=>{

let offer=p.mrp*0.5;

let params=new URLSearchParams({
package:"Aarogyam "+p.code,
tests:p.tests,
mrp:p.mrp
});

return `
<div class="card">

<h3>Aarogyam ${p.code}</h3>

<p>${p.tests} Tests Package</p>

<p>
<span class="old">${money(p.mrp)}</span>
</p>

<div class="price">${money(offer)}</div>

<div class="discount">50% DISCOUNT</div>

<p>आपकी बचत: ${money(p.mrp-offer)}</p>

<div class="buttons">

<a class="btn call"
href="tel:+918120262770">
Call Now
</a>

<a class="btn book"
href="booking.html?${params.toString()}">
Book Now
</a>

</div>
</div>
`;

}).join("");

</script>

</body>
</html>
